version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: zippy-postgres
    environment:
      POSTGRES_DB: zippydb
      POSTGRES_USER: zippy
      POSTGRES_PASSWORD: zippy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zippy -d zippydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zippy-network

  # Mock Courier Service (FastShip, QuickExpress, ReliableCourier)
  mock-courier-service:
    build:
      context: .
      dockerfile: mock-courier-service/Dockerfile
    container_name: mock-courier-service
    environment:
      ZIPPY_BACKEND_HOST: zippy-backend
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - zippy-network

  # Zippy Backend Service
  zippy-backend:
    build:
      context: .
      dockerfile: zippy-backend/Dockerfile
    container_name: zippy-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xmx512m -Xms256m"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      mock-courier-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - zippy-network

  # Zippy Frontend (React + Nginx)
  zippy-frontend:
    build:
      context: ./zippy-frontend
      dockerfile: Dockerfile
    container_name: zippy-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      zippy-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - zippy-network

volumes:
  postgres_data:
    driver: local

networks:
  zippy-network:
    driver: bridge
